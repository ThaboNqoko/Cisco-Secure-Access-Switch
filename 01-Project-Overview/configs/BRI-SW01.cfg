!===============================================================
! BR1-SW01 - Secure Access Switch Baseline
! Platform : Cisco Catalyst 3560 (48x 10/100 + 2x Gigabit uplinks)
! Version  : 1.0
! Author   : Thabo Nqoko
!
!
! Interface names assume Fa0/1-48 and Gi0/1-2. Adjust for other
! models (e.g. Gi1/0/1-48 on a 3650/9200).
! Run "crypto key generate rsa modulus 2048" manually after
! applying (it is an exec command, not part of the config).
!===============================================================
!
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
no service pad
!
hostname BR1-SW01
!
enable secret Branch123
username netadmin privilege 15 secret CHANGE_ME_ADMIN_SECRET
!
no aaa new-model
clock timezone SAST 2 0
no ip domain-lookup
ip domain-name lab.local
!
login block-for 120 attempts 3 within 60
!
!--------------------------- Layer 2 ---------------------------
vtp mode transparent
!
vlan 10
 name STAFF
vlan 20
 name GUEST
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree extend system-id
spanning-tree vlan 10,20,99 priority 4096
!
errdisable recovery cause psecure-violation
errdisable recovery cause bpduguard
errdisable recovery cause dhcp-rate-limit
errdisable recovery cause arp-inspection
errdisable recovery interval 300
!
!--------------------------- Layer 3 ---------------------------
ip routing
!
!------------------------ DHCP server --------------------------
ip dhcp excluded-address 192.168.10.1 192.168.10.20
ip dhcp excluded-address 192.168.20.1 192.168.20.20
!
ip dhcp pool STAFF
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 1.1.1.1
 domain-name lab.local
 lease 1
!
ip dhcp pool GUEST
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 1.1.1.1
 lease 0 8
!
!---------------- DHCP snooping and DAI -----------------------
! Switch is also the DHCP server, so Option 82 insertion is
! disabled (otherwise local DHCP replies can be dropped).
no ip dhcp snooping information option
ip dhcp snooping vlan 10,20
ip dhcp snooping database flash:dhcp-snooping.db
ip dhcp snooping
!
ip arp inspection vlan 10,20
ip arp inspection validate src-mac dst-mac ip
!
!----------------------------- ACLs ----------------------------
ip access-list standard MGMT-ACCESS
 remark SSH allowed only from Staff and Management subnets
 permit 192.168.10.0 0.0.0.255
 permit 192.168.99.0 0.0.0.255
 deny   any log
!
ip access-list extended GUEST-IN
 remark Allow DHCP client traffic
 permit udp any eq bootpc any eq bootps
 remark Allow ping to own gateway (testing)
 permit icmp 192.168.20.0 0.0.0.255 host 192.168.20.1 echo
 remark Block guest access to internal address space
 deny   ip 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255 log
 deny   ip 192.168.20.0 0.0.0.255 192.168.99.0 0.0.0.255 log
 deny   ip any 10.0.0.0 0.255.255.255
 deny   ip any 172.16.0.0 0.15.255.255
 deny   ip any 192.168.0.0 0.0.255.255
 remark Permit everything else (future uplink / internet)
 permit ip any any
!
!------------------------ Access ports -------------------------
interface range FastEthernet0/1 - 24
 description STAFF-ACCESS
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 storm-control broadcast level 20.00
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
 no cdp enable
!
interface range FastEthernet0/25 - 40
 description GUEST-ACCESS
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 storm-control broadcast level 20.00
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
 no cdp enable
!
interface range FastEthernet0/41 - 44
 description MGMT-RESERVED
 switchport mode access
 switchport access vlan 99
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
 no cdp enable
!
interface range FastEthernet0/45 - 48 , GigabitEthernet0/1 - 2
 description UNUSED-DISABLED
 switchport mode access
 switchport access vlan 999
 switchport nonegotiate
 shutdown
!
!--------------------------- SVIs ------------------------------
interface Vlan1
 no ip address
 shutdown
!
interface Vlan10
 description STAFF-GATEWAY
 ip address 192.168.10.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
!
interface Vlan20
 description GUEST-GATEWAY
 ip address 192.168.20.1 255.255.255.0
 ip access-group GUEST-IN in
 no ip redirects
 no ip proxy-arp
 no shutdown
!
interface Vlan99
 description MANAGEMENT-SVI
 ip address 192.168.99.1 255.255.255.0
 no autostate
 no ip redirects
 no ip proxy-arp
 no shutdown
!
!------------------- Services and logging ----------------------
no ip http server
no ip http secure-server
no ip bootp server
no ip source-route
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
logging buffered 16384 informational
logging console warnings
!
banner motd ^C
*****************************************************
  AUTHORISED ACCESS ONLY - BR1-SW01
  Activity on this device is monitored and logged.
  Disconnect now if you are not an authorised user.
*****************************************************
^C
!
!------------------------- Console / VTY -----------------------
line con 0
 exec-timeout 10 0
 logging synchronous
 login local
!
line vty 0 4
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
